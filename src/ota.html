<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.min.css" />
    <link rel="stylesheet" href="./css/milligram/milligram.min.css" />
    <link rel="stylesheet" href="./css/milligram/normalize.min.css" />
    <link rel="icon" href="data:," />
    <title>OTA Update</title>
  </head>
  <body>
    <div id="ajax-header"></div>
    <div class="container-f container-a-c">
      <div class="container container-j-c">
        <div class="row">
          <div class="column">
            <h1>OTA Update</h1>
            <form id="otaForm">
              <div class="row">
                <div class="column">
                  <div id="dropZoneID" class="drop-zone">
                    <label for="inputFileID">
                      <h4 class="badge">Select File</h4>
                    </label>
                    <h5 id="messageFileID"></h5>
                  </div>
                  <input id="inputFileID" class="file-upload" type="file" />
                  <br />
                  <button type="submit" disabled id="buttonSubmitID">
                    Update Firmware
                  </button>
                  <div id="messageContainerID" class="inline">
                    <h5 id="messageID"></h5>
                    <div id="spinerID" class="spinner d-none"></div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/ota.min.js"></script>
    <script src="./js/index.min.js"></script>
  </body>
</html>
