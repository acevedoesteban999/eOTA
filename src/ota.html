<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.min.css" />
    <link rel="stylesheet" href="./css/milligram/normalize.min.css" />
    <link rel="icon" href="data:," />
    <title>OTA Update</title>
  </head>
  <body>
    <div id="ajax-header"></div>
    <main class="c-f">
      <div class="c c-75 sh">
        <div class="r j-c">
          <div class="cl-6 cl-nw">
            <div class="h1 bd bd-pr h1 px-4">OTA Update</div>
            <form id="otaForm">
              <div id="dropZoneID" class="dr-z py-1 my-3">
                <div class="btn btn-pr my-3">Select File</div>
              </div>
              <div class="h6 my-2" id="messageFileID"></div>
              <input id="inputFileID" class="d-n" type="file" />

              <button
                class="btn btn-pr"
                type="submit"
                disabled
                id="buttonSubmitID"
              >
                Update Firmware
              </button>
              <div class="r my-2 j-c">
                <div class="cl-10">
                  <div id="messageContainerID">
                    <div class="r">
                      <div class="h5 my-1" id="messageID"></div>
                    </div>
                    <div class="r j-c">
                      <div id="spinerID" class="sp d-n j-c my-1"></div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="./js/ota.min.js"></script>
    <script src="./js/index.min.js"></script>
  </body>
</html>
